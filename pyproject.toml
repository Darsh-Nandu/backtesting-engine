[project]
name = "quantforge"
version = "1.0.0"
description = "Advanced multi-market backtesting engine with a web dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8"]
e2e = ["selenium>=4.20"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
